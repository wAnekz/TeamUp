[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers for every response. CSP origins:
#   *.googleapis.com / *.firebaseio.com  - Firestore, Auth, Storage, FCM
#   *.cloudfunctions.net                 - callable functions
#   teamup-6a054.firebaseapp.com, apis.google.com, accounts.google.com - Google sign-in popup
#   www.gstatic.com                      - FCM scripts imported by the service worker
#   img-src https:                       - avatars and event images come from many hosts
#   'sha256-…'                           - the inline pre-render script in index.html (re-hash if it changes)
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-9X1BK7duQ0Lydw0oDGYD6fC5XQq7efOLcSCq+bc01Kc=' https://apis.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.googleapis.com https://*.cloudfunctions.net https://*.firebaseio.com wss://*.firebaseio.com https://teamup-6a054.firebaseapp.com https://www.gstatic.com; frame-src https://teamup-6a054.firebaseapp.com https://accounts.google.com https://apis.google.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# Hashed build assets never change; the HTML shell and service worker must
# always be revalidated so a deploy reaches open tabs right away.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/firebase-messaging-sw.js"
  [headers.values]
    Cache-Control = "no-cache"
