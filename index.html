<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4F46E5" />
    <meta name="description" content="TeamUp - бесплатный сервис, где школьники 14-18 лет в Казахстане находят команду для хакатонов, олимпиад и проектов. Контакты видит только твоя команда." />
    <link rel="canonical" href="https://team-up-web.netlify.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TeamUp" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:url" content="https://team-up-web.netlify.app/" />
    <meta property="og:title" content="TeamUp - найди команду для хакатонов и олимпиад" />
    <meta property="og:description" content="Бесплатно для школьников 14-18 лет в Казахстане. Контакты видит только твоя команда." />
    <meta property="og:image" content="https://team-up-web.netlify.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TeamUp - найди команду для хакатонов и олимпиад" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="google-site-verification" content="F_7886BAP4Ed8gHlZ3iwFgniNWENAlp4VejX_c468Jo" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>TeamUp - найди команду для хакатонов и олимпиад</title>
    <!-- Applies the saved theme before paint (src/lib/theme.ts) and hides the pre-rendered hero for signed-in users, other languages and other pages. Its hash is allowed in netlify.toml's CSP. -->
    <script>try{var s=localStorage,d=document.documentElement,l=s.getItem('teamup:lang'),t=s.getItem('teamup:theme');if(t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches))d.classList.add('dark');if(location.pathname!=='/'||s.getItem('teamup:signedIn')||(l&&l!=='ru'))d.classList.add('no-prerender')}catch(e){}</script>
    <style>.no-prerender #prerender{display:none}</style>
  </head>
  <body class="bg-surface-50 text-surface-900 antialiased">
    <div id="root">
      <!-- Static copy of the landing hero so first paint doesn't wait for JS; React replaces it. -->
      <main id="prerender" class="mx-auto max-w-6xl px-4 pt-[4.75rem] sm:px-6 sm:pt-28">
        <p class="text-sm font-semibold text-accent-700">Для школьников 14-18 лет в Казахстане</p>
        <h1 class="mt-3 max-w-[20ch] text-[2.125rem] font-extrabold leading-[1.08] tracking-tight text-surface-900 sm:text-5xl lg:max-w-[38rem]">Найди команду для хакатонов и олимпиад</h1>
        <p class="mt-5 max-w-[46ch] text-base leading-relaxed text-surface-600 sm:text-lg">Вступай в команду, которой нужны твои навыки, или собери свою. Каждая команда и награда попадает в портфолио для поступления в университет.</p>
        <p class="mt-8 flex flex-col gap-3 sm:flex-row"><a href="/login?mode=signup" class="inline-flex h-12 items-center justify-center rounded-xl bg-accent-600 px-6 font-medium text-white">Создать аккаунт бесплатно</a><a href="/events" class="inline-flex h-12 items-center justify-center rounded-xl border border-surface-200 bg-white px-6 font-medium text-surface-800">Смотреть события</a></p>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
